name: deteksi_jambu
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1 
 
  # ── Image processing ──────────────────────────────────────────────────────
  image: ^4.1.7             # decode/resize gambar murni Dart, tanpa native lib
  image_picker: ^1.0.4      # sesuai versi yang dipakai
 
  # ── Camera live ───────────────────────────────────────────────────────────
  camera: ^0.10.5+9         # untuk live camera mode
 
  # ── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
